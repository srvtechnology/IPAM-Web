services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ipam_alumni
      MYSQL_USER: ipam
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ipam_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "3306:3306"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://ipam:${MYSQL_PASSWORD:-ipam_dev_password}@mysql:3306/ipam_alumni
      JWT_ALUMNI_SECRET: ${JWT_ALUMNI_SECRET:-dev-alumni-secret-change-me}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:-dev-admin-secret-change-me}
      AUDIT_HMAC_SECRET: ${AUDIT_HMAC_SECRET:-dev-audit-hmac-secret-change-me}
      NODE_ENV: production
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
    ports:
      - "3000:3000"

  adminer:
    image: adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8080:8080"

volumes:
  mysql_data:
