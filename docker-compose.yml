services:
  mysql:
    image: mysql:8.4
    command:
      - mysqld
      - --sort_buffer_size=16M
      - --join_buffer_size=8M
      - --max_allowed_packet=64M
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ipam_alumni
      MYSQL_USER: ipam
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ipam_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "3306:3306"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://ipam:${MYSQL_PASSWORD:-ipam_dev_password}@mysql:3306/ipam_alumni
      JWT_ALUMNI_SECRET: ${JWT_ALUMNI_SECRET:-dev-alumni-secret-change-me}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:-dev-admin-secret-change-me}
      AUDIT_HMAC_SECRET: ${AUDIT_HMAC_SECRET:-dev-audit-hmac-secret-change-me}
      NODE_ENV: production
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-growpos.official@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-IPAM Alumni Association}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-growpos.official@gmail.com}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      ACC_SID_TWILIO: ${ACC_SID_TWILIO:-}
      AUTH_TOKEN_TWILIO: ${AUTH_TOKEN_TWILIO:-}
      MSG_SERVICESID: ${MSG_SERVICESID:-}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-AIzaSyBiLw4ytLwtNmhjhDixxd2yGq8qo5UAf0I}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-auratrade-p93c.firebaseapp.com}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-auratrade-p93c}
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-auratrade-p93c.firebasestorage.app}
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-570831339769}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-1:570831339769:web:594df89ce062124522e228}
    ports:
      - "3000:3000"

  adminer:
    image: adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8080:8080"

volumes:
  mysql_data:
